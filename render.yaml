services:
  - type: web
    name: zheka-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_NAME
        value: "Жека"
      - key: NAME_TRIGGERS
        value: "жека,жек,жэка,zheka"
      - key: CHATTINESS
        value: "0.20"
      - key: QUESTION_BOOST
        value: "0.15"
      - key: REPLY_COOLDOWN_SEC
        value: "45"
      - key: MAX_REPLIES_PER_HOUR
        value: "30"
      - key: MAX_REPLIES_PER_DAY
        value: "250"
      - key: MODEL
        value: "claude-haiku-4-5"
      - key: CONTEXT_WINDOW
        value: "14"
      - key: MAX_TOKENS
        value: "120"
