services:
  - type: web
    name: zheka-bot
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MEMORY_TABLE
        value: "zheka_memory"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_NAME
        value: "Гена"
      - key: NAME_TRIGGERS
        value: "гена,ген,генка,геныч,gena"
      - key: CHATTINESS
        value: "0.15"
      - key: QUESTION_BOOST
        value: "0.15"
      - key: REPLY_COOLDOWN_SEC
        value: "45"
      - key: MAX_REPLIES_PER_HOUR
        value: "30"
      - key: MAX_REPLIES_PER_DAY
        value: "250"
      - key: CONVO_WINDOW_SEC
        value: "75"
      - key: CONVO_CHATTINESS
        value: "0.3"
      - key: CONVO_MIN_GAP
        value: "25"
      - key: MODEL
        value: "claude-haiku-4-5"
      - key: CONTEXT_WINDOW
        value: "14"
      - key: MAX_TOKENS
        value: "120"
      - key: OPINION_CONTEXT
        value: "25"
      - key: OPINION_MAX_TOKENS
        value: "280"
      - key: REACT_CHANCE
        value: "0.4"
